const app=document.getElementById('app'),guideDialog=document.getElementById('guideDialog'),guideBody=document.getElementById('guideBody'),guideLaunch=document.getElementById('guideLaunch');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guideRules={
 '69gis':{mode:'decision',cbm:'69-365',complete:'69-ta',limit:'2,190 days',subject:'69 kV GIS',status:'Is the GIS currently energized or in service?'},
 '138gis':{mode:'decision',cbm:'138-365',complete:'138-ta',limit:'2,920 days',subject:'138 kV GIS',status:'Is the GIS currently energized or in service?'},
 'acmotor':{mode:'variants',variants:[
  {label:'Standard 480 V Motor',description:'Annual Online PM; Offline PM at each T/A.',cbm:'ac-std480',complete:'ac-std480',subject:'standard 480 V motor',status:'Is the motor currently running?',shared:true,standard:true},
  {label:'Standard 5 kV / 15 kV Motor',description:'Annual Online PM; Offline PM at each T/A.',cbm:'ac-stdmv',complete:'ac-stdmv',subject:'standard 5 kV / 15 kV motor',status:'Is the motor currently running?',shared:true,standard:true},
  {label:'Critical 480 V Motor',description:'Annual condition inspection plus Complete PM.',cbm:'ac-critical-annual',complete:'ac-critical480',limit:'2,190 days',subject:'critical 480 V motor',status:'Is the motor currently running?'},
  {label:'Critical 5 kV / 15 kV Motor',description:'Annual condition inspection plus Complete PM.',cbm:'ac-critical-annual',complete:'ac-criticalmv',limit:'2,190 days',subject:'critical 5 kV / 15 kV motor',status:'Is the motor currently running?'}
 ]},
 'cable':{mode:'direct',note:'Cable and splice inspections are selected by their scheduled interval; operating-status logic does not apply.'},
 'dccharger':{mode:'direct',note:'DC Charger and battery PM uses scheduled 45-, 90-, and 365-day checklists. Redundant units may be maintained individually without waiting for a plant T/A.'},
 'dcmotor':{mode:'decision',cbm:'dcm365',complete:'dcmta',limit:'2,190 days',subject:'DC motor',status:'Is the motor currently running?'},
 'grounding':{mode:'direct',note:'Grounding PM is selected by the applicable system or area; operating-status logic does not apply.'},
 'lbs':{mode:'decision',cbm:'lbs90',complete:'lbsta',limit:'2,190 days',subject:'load break switch',status:'Is the load break switch currently energized or in service?'},
 'lvswgr':{mode:'decision',cbm:'lv365',complete:'lvta',limit:'2,190 days',subject:'LV switchgear or panel',status:'Is the equipment currently energized or in service?'},
 'mvswgr':{mode:'decision',cbm:'mv180',complete:'mvta',limit:'2,190 days',subject:'MV switchgear',status:'Is the switchgear currently energized or in service?'},
 'tieline':{mode:'decision',cbm:'tie180',complete:'tieta',limit:'2,190 days',subject:'tie line',status:'Is the tie line currently energized?',extra:'The 45-day visual inspection remains a separate routine requirement.'},
 'transformer':{mode:'decision',cbm:'tr365',complete:'trta',limit:'2,190 days',subject:'power transformer',status:'Is the transformer currently energized or in service?'},
 'ups':{mode:'direct',note:'UPS PM uses scheduled 45- and 90-day inspections. The annual load/discharge test and OEM maintenance remain required and are not replaced by the shutdown decision path.'}
};
let guideState={eid:null,rule:null},guideNotice=null;
function route(){const[eid,fid]=decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean),e=equipment.find(x=>x.id===eid),form=e?.forms.find(x=>x.id===fid);return{e,form}}
function crumbs(e,form){let h='<nav class="crumb" aria-label="Breadcrumb"><button data-go="">All equipment</button>';if(e)h+=' <span>›</span> '+(form?'<button data-go="'+e.id+'">'+esc(e.title)+'</button>':'<span>'+esc(e.title)+'</span>');if(form)h+=' <span>›</span> <span>'+esc(form.title)+'</span>';return h+'</nav>'}
function guideScreen({kicker='Guided PM',title,copy='',choices=[],back=null,progress=20}){
 guideBody.innerHTML='<div class="guide-bar"><span class="guide-kicker">'+esc(kicker)+'</span><button class="guide-close" type="button" aria-label="Close guided PM">×</button></div><div class="guide-progress" aria-hidden="true"><span style="width:'+progress+'%"></span></div><h2 id="guideTitle">'+esc(title)+'</h2><div class="guide-copy">'+copy+'</div><div class="guide-choices">'+choices.map((c,i)=>'<button type="button" class="guide-choice '+(c.tone||'')+'" data-guide-choice="'+i+'"><strong>'+esc(c.label)+'</strong>'+(c.description?'<span>'+esc(c.description)+'</span>':'')+'</button>').join('')+'</div><div class="guide-footer">'+(back?'<button type="button" class="guide-back">Back</button>':'<span></span>')+'<span class="guide-step">'+esc(kicker)+'</span></div>';
 guideBody.querySelector('.guide-close').addEventListener('click',()=>guideDialog.close());
 guideBody.querySelectorAll('[data-guide-choice]').forEach((b,i)=>b.addEventListener('click',choices[i].action));
 if(back)guideBody.querySelector('.guide-back').addEventListener('click',back);
}
function openGuide(){guideState={eid:null,rule:null};if(!guideDialog.open)guideDialog.showModal();showGuideStart()}
function showGuideStart(){guideScreen({kicker:'PM Checklist Assistant',title:'How would you like to begin?',copy:'<p>Browse the full equipment list, or answer a few questions to find the appropriate checklist.</p>',progress:10,choices:[
 {label:'Browse All Equipment',description:'Close this window and return to the complete equipment list.',action:()=>{guideDialog.close();guideNotice=null;if(location.hash)location.hash='';else render()}},
 {label:'Use Guided PM',description:'Select the equipment and follow the PM decision path.',tone:'primary',action:showGuideEquipment}
 ]})}
function showGuideEquipment(){guideScreen({kicker:'Step 1 of 4',title:'What equipment requires PM?',copy:'<p>Select the equipment category you are working on.</p>',progress:25,back:showGuideStart,choices:equipment.map(e=>({label:e.title,description:e.sub,action:()=>selectGuideEquipment(e.id)}))})}
function selectGuideEquipment(eid){
 const rule=guideRules[eid],e=equipment.find(x=>x.id===eid);guideState={eid,rule};
 if(rule.mode==='direct')return showDirectChecklists(e,rule);
 if(rule.mode==='variants')return showMotorVariants(rule);
 showOperatingStatus(rule);
}
function showDirectChecklists(e,rule){guideScreen({kicker:'Checklist Selection',title:'Select the scheduled checklist',copy:'<div class="guide-info">'+esc(rule.note)+'</div>',progress:65,back:showGuideEquipment,choices:e.forms.map(fm=>({label:fm.title,description:fm.interval,action:()=>openGuideChecklist(e.id,fm.id)}))})}
function showMotorVariants(rule){guideScreen({kicker:'Step 2 of 5',title:'What type of AC motor is this?',copy:'<p>The motor type determines the Online PM and shutdown PM checklists.</p>',progress:35,back:showGuideEquipment,choices:rule.variants.map(v=>({label:v.label,description:v.description,action:()=>{guideState.rule=v;showOperatingStatus(v)}}))})}
function showOperatingStatus(rule){guideScreen({kicker:'Operating Status',title:rule.status,copy:(rule.extra?'<div class="guide-info">'+esc(rule.extra)+'</div>':'')+'<p>Use the current equipment condition, not its normal design status.</p>',progress:48,back:()=>guideRules[guideState.eid].mode==='variants'?showMotorVariants(guideRules[guideState.eid]):showGuideEquipment,choices:[
 {label:'Yes — In Service',description:'The equipment cannot be opened or fully tested while energized or running.',action:()=>rule.standard?showStandardInService(rule):showCompleteDue(rule)},
 {label:'No — Stopped / De-energized',description:'The equipment is available for an outage inspection.',action:()=>showRecentComplete(rule)}
 ]})}
function shutdownPmName(rule){return rule.standard?'Offline PM':'Complete PM'}
function showStandardInService(rule){guideScreen({kicker:'Standard Motor PM',title:'Is this PM for the current planned T/A?',copy:'<p>Standard motors receive <strong>Online PM every year</strong> and <strong>Offline PM at each planned T/A</strong>. There is no separate 2,190-day maximum interval.</p>',progress:68,back:()=>showOperatingStatus(rule),choices:[
 {label:'No — Annual PM',description:'Proceed with the Annual Online PM checklist.',action:()=>openCBM(rule)},
 {label:'Yes — Current Planned T/A',description:'Review recent Offline PM history before repeating shutdown maintenance.',action:()=>showTARecentComplete(rule,()=>showStandardInService(rule))}
 ]})}
function showCompleteDue(rule){guideScreen({kicker:'Complete PM Status',title:'Is Complete PM due now?',copy:'<p>Choose whether the maximum interval of <strong>'+esc(rule.limit)+'</strong> has been reached, or Complete PM is being evaluated for the current planned T/A.</p>',progress:68,back:()=>showOperatingStatus(rule),choices:[
 {label:'No — Not Due',description:'The interval has not been reached and this is not the current planned T/A.',action:()=>openCBM(rule)},
 {label:'Maximum Interval Reached / Overdue',description:'A shutdown Complete PM is required.',tone:'warn',action:()=>showMandatoryWarning(rule)},
 {label:'Current Planned T/A',description:'Check whether a recent Complete PM qualifies for management review.',action:()=>showTARecentComplete(rule)}
 ]})}
function showTARecentComplete(rule,back=()=>showCompleteDue(rule)){const pmName=shutdownPmName(rule);guideScreen({kicker:'T/A Maintenance History',title:'Was '+pmName+' performed within the past 12 months?',copy:'<p>A recent '+pmName+' may be reviewed for deferral to the next T/A to avoid over-maintenance.'+(rule.standard?'':' This exception does not apply if the maximum interval has already been exceeded.')+'</p>',progress:78,back,choices:[
 {label:'Yes — Within 12 Months',description:'Obtain management review before repeating '+pmName+'.',action:()=>showOverMaintenance(rule,()=>showTARecentComplete(rule,back))},
 {label:'No — More Than 12 Months',description:'Proceed to the shutdown requirement for this T/A.',tone:'warn',action:()=>showMandatoryWarning(rule,'ta',()=>showTARecentComplete(rule,back))}
 ]})}
function showRecentComplete(rule){const pmName=shutdownPmName(rule);guideScreen({kicker:'Maintenance History',title:'Was '+pmName+' performed within the past 12 months?',copy:'<p>This check helps avoid repeating intrusive maintenance too soon when the equipment is already available for shutdown work.</p>',progress:70,back:()=>showOperatingStatus(rule),choices:[
 {label:'Yes — Within 12 Months',description:'Management review is recommended before repeating '+pmName+'.',action:()=>showOverMaintenance(rule)},
 {label:'No — More Than 12 Months',description:'Proceed to the '+pmName+' checklist.',tone:'primary',action:()=>openComplete(rule)}
 ]})}
function cbmChecklistLabel(rule){return rule.shared?'Online PM checklist':'CBM checklist'}
function showMandatoryWarning(rule,reason='interval',back=null){const isTA=reason==='ta',pmName=shutdownPmName(rule);guideScreen({kicker:'Mandatory PM Warning',title:isTA?pmName+' is required for this planned T/A':'The shutdown inspection limit has been reached',copy:'<div class="guide-warning"><strong>Coordinate with OPS to stop, de-energize, isolate, and LOTO the '+esc(rule.subject)+' for '+pmName+'.</strong><br>'+(isTA?pmName+' should be completed during this T/A unless a documented deferral is approved.':'Online or condition-based checks do not reset the overdue '+pmName+' interval.')+'</div>',progress:88,back:back||(isTA?()=>showTARecentComplete(rule):()=>showCompleteDue(rule)),choices:[
 {label:'Unable to Shut Down',description:'Open the '+cbmChecklistLabel(rule)+' and display the required deferral controls.',tone:'warn',action:()=>openCBM(rule,shutdownDeferralNotice(rule,reason))},
 {label:'Can Shut Down',description:'Open the '+pmName+' checklist.',tone:'primary',action:()=>openComplete(rule)}
 ]})}
function showOverMaintenance(rule,back=()=>showRecentComplete(rule)){const pmName=shutdownPmName(rule);guideScreen({kicker:'Over-Maintenance Review',title:'Obtain management review before repeating '+pmName,copy:'<div class="guide-info">Because '+pmName+' was performed within the past 12 months, the Electrical Manager or Engineer should determine whether it can be deferred to the next T/A. Document the decision'+(rule.standard?'.':' and keep the next PM within the maximum interval.')+'</div>',progress:88,back,choices:[
 {label:'Defer with Approval',description:'Open the '+cbmChecklistLabel(rule)+' and document the approved deferral.',action:()=>openCBM(rule,{kind:'info',title:pmName+' deferred after review',text:'The last '+pmName+' was within 12 months. Document Electrical Manager/Engineer approval and defer only to the next planned T/A.'})},
 {label:'Proceed with '+pmName,description:'Open the shutdown '+pmName+' checklist.',tone:'primary',action:()=>openComplete(rule)}
 ]})}
function shutdownDeferralNotice(rule,reason='interval'){const isTA=reason==='ta',interim=rule.shared?'Online PM':'CBM',pmName=shutdownPmName(rule);return{kind:'warning',title:isTA?pmName+' deferred from the planned T/A — temporary controls required':pmName+' is overdue — temporary controls required',text:'If OPS cannot release the '+rule.subject+', '+interim+' may be performed as an interim action, but it does not replace or reset '+pmName+'.',items:['OPS must document and accept the risk of deferral.','Electrical Manager/Engineer review is required.','Confirm '+interim+' and available online-monitoring results are acceptable.','Set the earliest practical outage date and track the '+pmName+' work order to closure.']}}
function openCBM(rule,notice=null){if(!notice&&rule.shared)notice={kind:'info',title:'Online PM selected',text:'Use the Online PM section of this motor checklist.'};openGuideChecklist(guideState.eid,rule.cbm,notice)}
function openComplete(rule){const notice=rule.shared?{kind:'info',title:'Offline PM selected',text:'Use the Offline PM section of this motor checklist after shutdown, isolation, and LOTO.'}:null;openGuideChecklist(guideState.eid,rule.complete,notice)}
function openGuideChecklist(eid,fid,notice=null){guideNotice=notice?{...notice,eid,fid}:null;guideDialog.close();const next='/'+eid+'/'+fid;if(location.hash.slice(1)===next)render();else location.hash=next}
function render(){
 const{e,form}=route();let h=crumbs(e,form);
 if(!e){
  h+='<div class="section-head"><div><h2>Electrical Equipment</h2><p>Select an equipment category to review its PM intervals and checklist items.</p></div><div class="count">'+equipment.length+' equipment categories</div></div><div class="grid">'+equipment.map((x,i)=>'<button class="card" data-go="'+x.id+'"><span class="num">'+String(i+1).padStart(2,'0')+'</span><strong>'+esc(x.title)+'</strong><small>'+esc(x.sub)+'</small><span class="foot">'+x.forms.length+' checklist'+(x.forms.length>1?'s':'')+'</span></button>').join('')+'</div>';
 }else if(!form){
  h+='<div class="section-head"><div><h2>'+esc(e.title)+'</h2><p>'+esc(e.sub)+'</p></div><div class="count">'+e.forms.length+' checklists</div></div><div class="split"><aside class="aside"><strong>PM Checklists</strong><p>Select an interval to view every inspection item and open the original checklist.</p></aside><div class="list">'+e.forms.map(x=>{const meta=x.source?(x.groups?x.groups.length+' system sections':x.items.length+' inspection items'):x.items.length+' inspection items · Binder pages '+x.start+(x.end>x.start?'–'+x.end:'');return'<button class="row" data-go="'+e.id+'/'+x.id+'"><span><strong>'+esc(x.title)+'</strong><small>'+meta+'</small></span><span class="pill">'+esc(x.interval)+'</span></button>'}).join('')+'</div></div>';
 }else{
  const p='Page '+form.start+(form.end>form.start?'–'+form.end:'');
 const itemContent=form.groups?form.groups.map(g=>'<section class="pmgroup '+g.kind+'"><h3>'+esc(g.title)+'</h3><ol class="items">'+g.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></section>').join(''):'<h3>Inspection Items</h3><ol class="items">'+form.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>';
  const activeNotice=guideNotice&&guideNotice.eid===e.id&&guideNotice.fid===form.id?guideNotice:null;
  const noticeContent=activeNotice?'<aside class="guided-notice '+(activeNotice.kind==='warning'?'warning':'')+'"><strong>'+esc(activeNotice.title)+'</strong><div>'+esc(activeNotice.text)+'</div>'+(activeNotice.items?'<ul>'+activeNotice.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'<button class="notice-dismiss" type="button" data-dismiss-note>Dismiss reminder</button></aside>':'';
  const file=form.source||'checklists.pdf';
  const buttons=form.source?'<a class="open" href="'+checklistHref(file,form.start)+'" target="_blank" rel="noopener">Open Checklist PDF</a>':'<a class="open" href="'+checklistHref(file,form.start)+'" target="_blank" rel="noopener">Open Checklist · '+p+'</a><a class="open secondary" href="'+checklistHref(file)+'" target="_blank" rel="noopener">Open Complete Binder</a>';
  const source=form.source?'Source: '+checklistFile(form.source)+'.':'Source: Binder1.pdf. PM intervals were cross-checked against Electrical PM Improvement Presentation (Eng), Revision 13.';
  h+='<article class="detail"><span class="eyebrow">'+esc(e.title)+'</span><h2>'+esc(form.title)+'</h2><span class="interval">'+esc(form.interval)+'</span>'+noticeContent+itemContent+'<div class="actions">'+buttons+'</div><div class="source">'+esc(source)+'</div></article>';
 }
 app.innerHTML=h;app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{guideNotice=null;location.hash=b.dataset.go?'/'+b.dataset.go:''}));app.querySelector('[data-dismiss-note]')?.addEventListener('click',()=>{guideNotice=null;render()});scrollTo({top:0,behavior:'instant'});
}
guideLaunch.addEventListener('click',openGuide);guideDialog.addEventListener('click',e=>{if(e.target===guideDialog)guideDialog.close()});addEventListener('hashchange',render);render();if(!location.hash)requestAnimationFrame(openGuide);
</script></body></html>
